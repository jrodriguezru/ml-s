name: Deploy FastAPI to AWS EC2

on:
  push:
    branches:
      - main  # Desencadenar acción al hacer push a la rama "main"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3 

    # Si se necesita Python, se debe inicializar aqui.

    - name: Copy files to EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
        EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "${EC2_SSH_KEY}" > ~/.ssh/id_rsa
        chmod 400 ~/.ssh/id_rsa
        ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

        # Copiar los archivos del repo al EC2
        rsync -avz -e "ssh -o StrictHostKeyChecking=no" . $EC2_USER@$EC2_HOST:/home/$EC2_USER/app

    - name: Deploy on EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
      run: |
        ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
          cd ~/app

          # Construir y ejecutar el contenedor Docker
          docker-compose down || true
          docker-compose up --build -d
        EOF
